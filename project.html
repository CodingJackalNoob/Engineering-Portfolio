<!DOCTYPE html>
<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B1420;--bg2:#0E1B2B;--panel:#101C2C;--line:#22384D;--ink:#E7ECF2;--ink-dim:#8CA0B3;--accent:#FF8A3D;--accent2:#5FD0C6;--font-body:'IBM Plex Sans',system-ui,sans-serif;--font-mono:'IBM Plex Mono',monospace;box-sizing:border-box}*{box-sizing:inherit;margin:0;padding:0}html{scroll-behavior:smooth}body{background:var(--bg);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:48px 48px;color:var(--ink);font-family:var(--font-body);line-height:1.5}a{color:var(--accent2)}.mono{font-family:var(--font-mono)}.wrap{max-width:880px;margin:0 auto;padding:0 24px}header{border-bottom:1px solid var(--line);background:rgba(11,20,32,.94);backdrop-filter:blur(4px);position:sticky;top:0;z-index:10}.tb-row{max-width:880px;margin:0 auto;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.tb-name{font-weight:600;font-size:1rem}.tb-name span{display:block;color:var(--ink-dim);font:0.78rem var(--font-mono);margin-top:2px}.tb-actions{display:flex;align-items:center;gap:12px}nav{display:flex;gap:18px;font:0.82rem var(--font-mono)}nav a{color:var(--ink-dim);text-decoration:none}nav a:hover{color:var(--ink)}button{font:0.75rem var(--font-mono);cursor:pointer}.admin-trigger,.admin-action,.modal-actions button{border:1px solid var(--line);background:transparent;color:var(--ink-dim);padding:7px 11px;border-radius:2px}.admin-trigger:hover,.admin-action:hover,.modal-actions button:hover{border-color:var(--accent);color:var(--accent)}.admin-trigger.active{border-color:var(--accent2);color:var(--accent2)}.admin-rail{display:none;border:1px solid var(--accent2);background:rgba(16,28,44,.94);padding:14px 16px;margin-top:24px;align-items:center;justify-content:space-between;gap:14px}.admin-mode .admin-rail{display:flex}.admin-rail strong{font-size:.92rem}.admin-rail span{display:block;color:var(--ink-dim);font-size:.78rem;margin-top:2px}.admin-actions{display:flex;gap:8px;flex-wrap:wrap}.admin-action.primary{border-color:var(--accent);color:var(--accent)}.admin-only{display:none}.admin-mode .admin-only{display:inline-flex}.edit-button{display:flex;margin:0 0 12px auto}.hero{padding:64px 0 46px;border-bottom:1px solid var(--line)}.back-link{font:0.78rem var(--font-mono);color:var(--ink-dim);text-decoration:none}.back-link:hover{color:var(--accent2)}.hero .tag{font:0.85rem var(--font-mono);color:var(--accent);margin:26px 0 14px}.hero h1{font-size:clamp(1.8rem,4.5vw,2.9rem);line-height:1.15;font-weight:600}.hero p{color:var(--ink-dim);max-width:64ch;margin-top:18px;font-size:1rem}.section{padding:52px 0;border-bottom:1px solid var(--line)}.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:28px;flex-wrap:wrap}.sec-head h2{font-size:1.3rem}.sheet-no{font:0.78rem var(--font-mono);color:var(--ink-dim)}.timeline{position:relative;padding-left:28px}.timeline:before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:1px;background:var(--line)}.t-item{position:relative;padding-bottom:28px}.t-item:last-child{padding-bottom:0}.t-item:before{content:"";position:absolute;left:-28px;top:4px;width:9px;height:9px;background:var(--bg);border:2px solid var(--accent2);border-radius:50%}.t-date{color:var(--accent);font:0.76rem var(--font-mono)}.t-title{font-weight:600;margin-top:4px}.t-body,.log-entry .body{color:var(--ink-dim);font-size:.9rem;margin-top:4px}.log-entry{border-left:2px solid var(--line);padding:4px 0 4px 18px;margin-bottom:24px;position:relative}.log-entry .rev{font:0.72rem var(--font-mono);color:var(--ink-dim)}.log-entry h3{font-size:1rem;margin-top:4px}.log-media{margin-top:12px;border:1px solid var(--line);background:var(--panel);aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;color:var(--ink-dim);font:0.76rem var(--font-mono);max-width:520px}.media-preview{width:100%;height:100%;object-fit:cover}.empty-state{color:var(--ink-dim);font:0.8rem var(--font-mono);padding:18px 0}.modal-backdrop{display:none;position:fixed;inset:0;z-index:30;background:rgba(5,10,16,.78);align-items:center;justify-content:center;padding:20px}.modal-backdrop.open{display:flex}.modal{width:min(100%,560px);max-height:calc(100vh - 40px);overflow:auto;background:var(--panel);border:1px solid var(--line);padding:24px;box-shadow:0 18px 70px rgba(0,0,0,.35)}.modal-head{display:flex;justify-content:space-between;gap:16px;align-items:start;margin-bottom:20px}.modal h2{font-size:1.15rem}.modal-kicker{color:var(--accent);font:0.72rem var(--font-mono);margin-bottom:5px}.close-modal{border:0;background:none;color:var(--ink-dim);font-size:1.35rem;cursor:pointer}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font:0.72rem var(--font-mono);color:var(--ink-dim);text-transform:uppercase}.field input,.field textarea{width:100%;border:1px solid var(--line);background:var(--bg2);color:var(--ink);padding:9px 10px;font:.88rem var(--font-body);border-radius:2px}.field textarea{min-height:110px;resize:vertical}.field input:focus,.field textarea:focus{outline:1px solid var(--accent2);border-color:var(--accent2)}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}.modal-actions .save{background:var(--accent);border-color:var(--accent);color:#101820;font-weight:600}.modal-actions .danger{margin-right:auto;color:var(--accent);border-color:var(--accent)}.video-drop{border:1px dashed var(--line);padding:14px;color:var(--ink-dim);font:.75rem var(--font-mono);cursor:pointer}.video-drop input{display:none}.password-wrap{position:relative}.password-wrap input{padding-right:42px}.password-toggle{position:absolute;top:50%;right:8px;transform:translateY(-50%);border:0;background:transparent;color:var(--ink-dim);padding:5px;font-size:1rem}.password-toggle:hover{color:var(--accent2)}footer{padding:28px 0 40px;text-align:center;color:var(--ink-dim);font:.75rem var(--font-mono)}
button{font:0.75rem var(--font-mono);cursor:pointer}@media(max-width:640px){nav{display:none}.tb-row{padding:12px 18px}.admin-rail{align-items:flex-start;flex-direction:column}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.modal{padding:18px}}.timeline-drag{display:none}.admin-mode .timeline-drag{display:inline-flex;align-items:center;justify-content:center;position:absolute;left:-58px;top:0;width:24px;height:24px;border:1px solid var(--line);color:var(--ink-dim);cursor:grab}.admin-mode .timeline-drag:active{cursor:grabbing}.t-item.dragging{opacity:.45}.t-item.drop-target{border-top:1px solid var(--accent2);padding-top:10px}
</style>
</head>
<body>
<header><div class="tb-row"><div class="tb-name">JORDAN REYES <span>MECHANICAL + EMBEDDED SYSTEMS — PROJECT DETAIL</span></div><div class="tb-actions"><nav><a href="index.html#projects">Projects</a><a href="index.html#contact">Contact</a></nav><button class="admin-trigger" id="adminTrigger" type="button">Admin login</button></div></div></header>
<main class="wrap"><div class="admin-rail" id="adminRail"><div><strong>Admin mode</strong><span>Editing this project only. Changes are saved in this browser.</span></div><div class="admin-actions"><button class="admin-action primary" data-add="timeline" type="button">+ Add timeline</button><button class="admin-action" data-add="update" type="button">+ Add update</button><button class="admin-action" id="signOut" type="button">Sign out</button></div></div><section class="hero"><a class="back-link" href="index.html#projects">← Back to all projects</a><div class="tag" id="projectTag">// project detail</div><h1 id="projectTitle">Project</h1><p id="projectSummary"></p></section><section class="section"><div class="sec-head"><h2>Timeline</h2><div class="sheet-no mono">MILESTONES</div></div><div class="timeline" id="timelineList"></div></section><section class="section"><div class="sec-head"><h2>Build Log</h2><div class="sheet-no mono">PROJECT UPDATES</div></div><div id="logList"></div></section></main><footer>REV A — LAST UPDATED SEP 2026</footer>
<div class="modal-backdrop" id="modalBackdrop" aria-hidden="true"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><div><div class="modal-kicker" id="modalKicker">ADMIN EDITOR</div><h2 id="modalTitle">Sign in</h2></div><button class="close-modal" id="closeModal" type="button" aria-label="Close">×</button></div><form id="adminForm"></form></div></div>
<script>
const fallbackProjects=[{id:'wizard-chess',title:'Wizard Chess Set',status:'active',summary:'A real-life magnetic chessboard that moves its own pieces.',detail:'A belt-driven XY carriage under the board drags pieces into place with an electromagnet.',stack:['Arduino Uno','XY Plotter','Electromagnet','C++']}];
const fallbackTimeline=[{project:'wizard-chess',date:'SEP 2026',title:'Wizard Chess — project started',body:'Began scoping the XY-plotter + electromagnet build.'}];
const fallbackUpdates=[];
function loadData(key,fallback){try{return JSON.parse(localStorage.getItem(key))||fallback}catch{return fallback}}
const projects=loadData('engineering-projects',fallbackProjects),timeline=loadData('engineering-timeline',fallbackTimeline),updates=loadData('engineering-updates',fallbackUpdates);const id=new URLSearchParams(location.search).get('id');const project=projects.find(item=>item.id===id)||projects[0];timeline.forEach(item=>{if(!item.project)item.project=projects[0]?.id});let isAdmin=false;const $=selector=>document.querySelector(selector);function esc(value){return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}function save(){localStorage.setItem('engineering-timeline',JSON.stringify(timeline));localStorage.setItem('engineering-updates',JSON.stringify(updates))}
function render(){document.title=`${project.title} — Engineering Log`;$('#projectTag').textContent=`// ${project.status} project`;$('#projectTitle').textContent=project.title;$('#projectSummary').textContent=project.summary;const milestones=timeline.filter(item=>item.project===project.id);$('#timelineList').innerHTML=milestones.length?milestones.map(item=>`<div class="t-item" draggable="${isAdmin}" data-timeline-index="${timeline.indexOf(item)}">${isAdmin?`<button class="timeline-drag admin-only" type="button" aria-label="Drag to reorder">↕</button><button class="admin-only admin-action edit-button" data-edit="timeline" data-index="${timeline.indexOf(item)}" type="button">Edit</button>`:''}<div class="t-date mono">${esc(item.date)}</div><div class="t-title">${esc(item.title)}</div><div class="t-body">${esc(item.body)}</div></div>`).join(''):'<div class="empty-state">No milestones yet.</div>';const entries=updates.filter(item=>item.project===project.id);$('#logList').innerHTML=entries.length?entries.map(item=>`<div class="log-entry">${isAdmin?`<button class="admin-only admin-action edit-button" data-edit="update" data-id="${esc(item.id)}" type="button">Edit</button>`:''}<div class="rev mono">${esc(item.rev)}</div><h3>${esc(item.title)}</h3><div class="body">${esc(item.body)}</div>${item.hasMedia?`<div class="log-media mono">${item.videoUrl?`<video class="media-preview" controls src="${esc(item.videoUrl)}"></video>`:'VIDEO PLACEHOLDER'}</div>`:''}</div>`).join(''):'<div class="empty-state">No build updates yet.</div>';document.querySelectorAll('[data-edit]').forEach(button=>button.addEventListener('click',()=>openEditor(button.dataset.edit,button.dataset.id??button.dataset.index)));wireTimelineDrag()}
function wireTimelineDrag(){if(!isAdmin)return;let draggedIndex=null;document.querySelectorAll('.t-item[data-timeline-index]').forEach(item=>{item.addEventListener('dragstart',()=>{draggedIndex=Number(item.dataset.timelineIndex);item.classList.add('dragging')});item.addEventListener('dragend',()=>{item.classList.remove('dragging');document.querySelectorAll('.drop-target').forEach(target=>target.classList.remove('drop-target'))});item.addEventListener('dragover',event=>{event.preventDefault();if(Number(item.dataset.timelineIndex)!==draggedIndex)item.classList.add('drop-target')});item.addEventListener('dragleave',()=>item.classList.remove('drop-target'));item.addEventListener('drop',event=>{event.preventDefault();const targetIndex=Number(item.dataset.timelineIndex);if(draggedIndex===null||draggedIndex===targetIndex)return;const moved=timeline.splice(draggedIndex,1)[0];timeline.splice(targetIndex>draggedIndex?targetIndex-1:targetIndex,0,moved);save();render()})})}
function openModal(){ $('#modalBackdrop').classList.add('open');$('#modalBackdrop').setAttribute('aria-hidden','false')}function closeModal(){$('#modalBackdrop').classList.remove('open');$('#modalBackdrop').setAttribute('aria-hidden','true');$('#adminForm').reset()}function input(label,name,value='',type='text'){return `<div class="field"><label for="${name}">${label}</label><input id="${name}" name="${name}" type="${type}" value="${esc(value)}" required></div>`}function area(label,name,value=''){return `<div class="field full"><label for="${name}">${label}</label><textarea id="${name}" name="${name}" required>${esc(value)}</textarea></div>`}
function openLogin(){$('#modalKicker').textContent='PRIVATE WORKSPACE';$('#modalTitle').textContent='Admin sign in';$('#adminForm').innerHTML=`<div class="form-grid">${input('Username','username')||''}<div class="field"><label for="password">Password</label><div class="password-wrap"><input id="password" name="password" type="password" required><button class="password-toggle" id="passwordToggle" type="button" aria-label="Show password">◉</button></div></div></div><div class="modal-actions"><button class="save" type="submit">Enter admin mode</button></div>`;$('#adminForm').dataset.kind='login';openModal();$('#passwordToggle').addEventListener('click',event=>{const field=$('#password'),visible=field.type==='text';field.type=visible?'password':'text';event.currentTarget.setAttribute('aria-label',visible?'Show password':'Hide password')})}
function openEditor(kind,value){const item=kind==='timeline'?timeline[Number(value)]:updates.find(update=>update.id===value);const editing=Boolean(item);$('#modalTitle').textContent=`${editing?'Edit':'Add'} ${kind==='timeline'?'timeline milestone':'build update'}`;if(kind==='timeline')$('#adminForm').innerHTML=`<div class="form-grid">${input('Date','date',item?.date)}${input('Title','title',item?.title)}${area('Description','body',item?.body)}</div><div class="modal-actions">${editing?'<button class="danger" data-delete="timeline" type="button">Delete</button>':''}<button class="save" type="submit">Save milestone</button></div>`;if(kind==='update')$('#adminForm').innerHTML=`<div class="form-grid">${input('Revision','rev',item?.rev)}${input('Title','title',item?.title)}${input('Video URL','videoUrl',item?.videoUrl||'','url')}${area('Notes','body',item?.body)}<div class="field full"><label for="videoFile">Video file</label><label class="video-drop">Drop a video here or choose a file<input id="videoFile" type="file" accept="video/*"></label></div><input name="id" type="hidden" value="${esc(item?.id||`update-${Date.now()}`)}"></div><div class="modal-actions">${editing?'<button class="danger" data-delete="update" type="button">Delete</button>':''}<button class="save" type="submit">Save update</button></div>`;$('#adminForm').dataset.kind=kind;$('#adminForm').dataset.index=kind==='timeline'?value:item?.id||'';openModal();const file=$('#videoFile');if(file)file.addEventListener('change',()=>{if(file.files[0])$('#videoUrl').value=URL.createObjectURL(file.files[0])})}
$('#adminTrigger').addEventListener('click',()=>isAdmin?$('#signOut').click():openLogin());$('#closeModal').addEventListener('click',closeModal);$('#modalBackdrop').addEventListener('click',event=>{if(event.target===$('#modalBackdrop'))closeModal()});document.querySelectorAll('[data-add]').forEach(button=>button.addEventListener('click',()=>openEditor(button.dataset.add)));$('#signOut').addEventListener('click',()=>{isAdmin=false;document.body.classList.remove('admin-mode');$('#adminTrigger').textContent='Admin login';$('#adminTrigger').classList.remove('active');render()});$('#adminForm').addEventListener('click',event=>{if(!event.target.dataset.delete)return;const kind=event.target.dataset.delete,index=kind==='timeline'?Number($('#adminForm').dataset.index):updates.findIndex(item=>item.id===$('#adminForm').dataset.index);if(kind==='timeline')timeline.splice(index,1);else updates.splice(index,1);save();closeModal();render()});$('#adminForm').addEventListener('submit',event=>{event.preventDefault();const data=Object.fromEntries(new FormData($('#adminForm'))),kind=$('#adminForm').dataset.kind;if(kind==='login'){if(data.username==='admin'&&data.password==='buildlog'){isAdmin=true;document.body.classList.add('admin-mode');$('#adminTrigger').textContent='Admin active';$('#adminTrigger').classList.add('active');closeModal();render()}else alert('Invalid admin credentials.');return}if(kind==='timeline'){const value={project:project.id,date:data.date,title:data.title,body:data.body},index=Number($('#adminForm').dataset.index);index>=0?timeline.splice(index,1,value):timeline.push(value)}if(kind==='update'){const value={id:data.id,project:project.id,rev:data.rev,title:data.title,body:data.body,videoUrl:data.videoUrl,hasMedia:Boolean(data.videoUrl)},index=updates.findIndex(item=>item.id===$('#adminForm').dataset.index);index<0?updates.push(value):updates.splice(index,1,value)}save();closeModal();render()});render();
</script>
</body>
</html>
